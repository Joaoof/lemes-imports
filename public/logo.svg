<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" role="img" aria-label="Lemes Imports">
    <title>Lemes Imports</title>

    <!--
        Wordmark em vetor, fundo transparente.

        As letras sao desenhadas como caminhos, nao como <text>: um SVG
        carregado via <img> nao enxerga as fontes da pagina, entao
        font-family cairia num fallback do sistema e a marca mudaria de
        cara em cada aparelho.

        Para trocar pelo arquivo oficial da loja:
        painel > Dados da loja > Escolher imagem.
    -->

    <defs>
        <linearGradient id="brasa" x1="0" y1="0.1" x2="1" y2="0.9">
            <stop offset="0%"   stop-color="#E8590C"/>
            <stop offset="42%"  stop-color="#F97316"/>
            <stop offset="100%" stop-color="#FFB84D"/>
        </linearGradient>
    </defs>

    <g fill="url(#brasa)">
        <!--  L  -->
        <path d="M16 12h22v50h30v18H16z"/>
        <!--  E  -->
        <path d="M78 12h54v17H100v9h29v16h-29v9h33v17H78z"/>
        <!--  M  -->
        <path d="M142 12h24l16 27 16-27h24v68h-22V49l-14 23h-8l-14-23v31h-22z"/>
        <!--  E  -->
        <path d="M234 12h54v17h-32v9h29v16h-29v9h33v17h-55z"/>
        <!--  S  -->
        <path d="M296 58h22c0 5 4 7 11 7 6 0 10-2 10-6 0-4-4-5-14-7-19-3-28-10-28-22 0-13 12-21 32-21 21 0 33 8 34 22h-22c-1-4-5-6-11-6-6 0-9 2-9 5 0 4 4 5 15 7 19 3 28 10 28 22 0 14-13 22-35 22-22 0-33-8-33-23z"/>
    </g>

    <!--  Filetes laterais do subtitulo  -->
    <rect x="24"  y="103" width="52" height="4" rx="2" fill="url(#brasa)"/>
    <rect x="344" y="103" width="52" height="4" rx="2" fill="url(#brasa)"/>

    <g fill="url(#brasa)">
        <!--  I M P  -->
        <path d="M92 94h8v22h-8z"/>
        <path d="M110 94h9l6 11 6-11h9v22h-8v-11l-5 8h-4l-5-8v11h-8z"/>
        <path d="M148 94h16c7 0 11 4 11 9s-4 9-11 9h-8v4h-8zm8 6v6h6c2 0 3-1 3-3s-1-3-3-3z"/>

        <!--  A chama, no lugar da letra O  -->
        <path d="M196 90c5 4 8 8 8 12 0 5-4 9-8 9s-8-4-8-9c0-4 3-8 8-12z"/>

        <!--  R T S  -->
        <path d="M216 94h17c7 0 11 3 11 8 0 3-2 6-5 7l6 7h-10l-5-6h-6v6h-8zm8 6v5h7c2 0 3-1 3-2.5s-1-2.5-3-2.5z"/>
        <path d="M250 94h26v6h-9v16h-8v-16h-9z"/>
        <path d="M280 109h8c0 2 2 3 5 3s4-1 4-2c0-1-1-2-5-2-8-1-12-4-12-8 0-5 5-7 13-7 9 0 13 3 14 8h-8c0-2-2-3-5-3s-4 1-4 2 2 2 6 2c8 1 12 4 12 8 0 5-5 7-14 7-9 0-14-3-14-8z"/>
    </g>
</svg>
